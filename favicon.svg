<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mapper">
  <title>mapper</title>
  <!--
    Das Zeichen von mapper: ein Weg von einem Startpunkt zu einem Ziel.

    Es ist die Quelle fuer ALLE Groessen - Registerkarte, Startbildschirm,
    Kopfzeile. Wer es aendert, laesst danach `node scripts/build-icons.mjs`
    laufen, sonst zeigen die PNG-Fassungen weiter das alte Bild.

    Auf ein 32er-Raster gezeichnet, damit die Kanten bei 16 px auf ganzen
    Pixeln liegen. Bewusst ohne feine Strichelung: gepunktet sah die Strecke
    bei 96 px hervorragend aus und war bei 16 px verschwunden.
  -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <path d="M7 25.2h7.5c3.6 0 5.6-1.6 6.6-4.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="6.8" cy="25.2" r="3.6" fill="#2563eb" stroke="#fff" stroke-width="2.4"/>
  <path d="M21.5 2.4c-3.3 0-6 2.7-6 6 0 4.5 6 11.2 6 11.2s6-6.7 6-11.2c0-3.3-2.7-6-6-6z" fill="#fff"/>
  <circle cx="21.5" cy="8.6" r="2.4" fill="#2563eb"/>
</svg>
