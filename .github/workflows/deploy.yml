name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches:
      - main
      - claude/standorte-routen-karte-ifidfy
  workflow_dispatch:

# Der Weg ueber actions/deploy-pages scheiterte daran, dass der Actions-Token
# die Pages-Seite nicht selbst anlegen darf ("Resource not accessible by
# integration"). GitHub bedient den Branch gh-pages dagegen von sich aus,
# deshalb wird das gebaute Ergebnis dorthin geschrieben.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typen und Tests pruefen
        run: |
          pnpm exec tsc -b --pretty false
          pnpm exec vitest run

      - name: Bauen
        env:
          # Bei Projektseiten liegt die Anwendung unter /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Beide Supabase-Werte sind bewusst oeffentlich: der publishable key
          # ist fuer den Browser gedacht und wird allein durch Row Level
          # Security abgesichert. Eigene Werte lassen sich als
          # Repository-Secrets hinterlegen, sie haben dann Vorrang.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://iisiaoexusvoecytznwg.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_fpGmNfPEo6g1JIpfRbNQ7g_FyHGdfSd' }}
          VITE_OSRM_BASE_URL: ${{ secrets.VITE_OSRM_BASE_URL || 'https://router.project-osrm.org' }}
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}
          VITE_NOMINATIM_BASE_URL: ${{ secrets.VITE_NOMINATIM_BASE_URL || 'https://nominatim.openstreetmap.org' }}
        run: pnpm exec vite build

      - name: Auslieferung vorbereiten
        run: |
          # Sourcemaps legen den vollstaendigen Quelltext offen und haben auf
          # einer oeffentlichen Seite nichts verloren.
          rm -f dist/assets/*.map
          # Pages liefert bei unbekannten Pfaden 404.html aus.
          cp dist/index.html dist/404.html
          # Ohne diese Datei laesst Pages die Ausgabe durch Jekyll laufen und
          # verwirft dabei Verzeichnisse, die mit einem Unterstrich beginnen.
          touch dist/.nojekyll

      - name: Nach gh-pages schreiben
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Der Branch traegt nur Bauergebnisse; eine Historie davon nuetzt
          # niemandem und laesst das Repository unnoetig wachsen.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Veroeffentlichung aus ${{ github.sha }}"
